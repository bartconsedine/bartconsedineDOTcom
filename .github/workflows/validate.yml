name: Validate code and database policies
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm test
      - run: npm run build
# No credentials, hosted migrations, enrollment, backups, or deployments run in CI.
